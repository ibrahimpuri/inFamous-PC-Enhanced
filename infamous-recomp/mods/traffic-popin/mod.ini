; inFamous Launcher mod. Enable it on the launcher's Mods page; its [env] values are applied on top of
; your settings when the game starts.
[mod]
name=Less Traffic Pop-in
version=1.0
author=inFamous Launcher (example mod)
description=Traffic only spawns where you can't see it: points near the edge of the screen count as visible too, so fewer cars appear out of nowhere when you turn the camera. Uses the port's traffic spawn knob from car_v233.h (CAR_SPAWN_VIS_RADIUS, game value 1000 cm).
experimental=1

[env]
CAR_SPAWN_VIS_RADIUS=3000
